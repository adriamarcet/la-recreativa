<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dimoni del Turó</title>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../assets/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Press Start 2P";src:url("../../assets/fonts/press-start-2p.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: arcade cabinet — header strip, 16:9 pixel screen, touch pad below (portrait) or at the sides (landscape) */
:root{
  --bg:#0f0b12; --panel:#1b1420; --ink:#f3e7ea; --dim:#8c7a8a;
  --rose:#e88672; --pumpkin:#ff7a1a; --gold:#e8c25a; --line:#3a2c3c;
  --px:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--px);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{width:100%;max-width:1152px;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.back{font-size:9px;line-height:1.5;color:var(--ink);text-decoration:none;padding:6px 8px;box-shadow:0 0 0 2px var(--ink);flex:none}
.back:focus-visible{outline:3px solid var(--pumpkin);outline-offset:3px}
h1{margin:0;font-size:12px;letter-spacing:.06em;color:var(--rose);text-shadow:2px 2px 0 #5a1f22;flex:1 1 auto;text-align:center}
h1 span{color:var(--pumpkin)}
.tg{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sound{font-family:var(--px);font-size:9px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:7px 9px;cursor:pointer}
.sound:focus-visible,.b:focus-visible{outline:2px solid var(--pumpkin);outline-offset:2px}
.screen{position:relative;width:min(100%, calc((100vh - 140px) * 1.7778));width:min(100%, calc((100dvh - 140px) * 1.7778));max-width:1152px;aspect-ratio:16/9;border:3px solid var(--line);box-shadow:0 0 0 3px #000,0 10px 40px rgba(232,134,114,.18);background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hint{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-size:8px;line-height:1.8;color:var(--dim);text-align:center;max-width:1152px;margin:0}
.hint b{font-weight:400}
.hint .p1{color:var(--rose)} .hint .p2{color:var(--gold)}
.ctrl{display:none}
.pad{position:relative;width:132px;height:132px;border-radius:50%;background:var(--panel);border:3px solid var(--line);touch-action:none;flex:none}
.pad::before,.pad::after{content:"";position:absolute;background:#2a2030;border-radius:4px}
.pad::before{left:50%;top:14px;bottom:14px;width:34px;transform:translateX(-50%)}
.pad::after{top:50%;left:14px;right:14px;height:34px;transform:translateY(-50%)}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--rose);box-shadow:inset -4px -5px 0 #a8483c,inset 3px 3px 0 #ffc2b0;z-index:2;pointer-events:none}
.btns{display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:10px;touch-action:none;flex:none}
.b{font-family:var(--px);font-size:8px;color:#1a0d08;border:none;border-radius:50%;width:64px;height:64px;touch-action:none;cursor:pointer;
   box-shadow:inset -4px -5px 0 rgba(0,0,0,.3),0 4px 0 #000}
.b.on{transform:translateY(3px);box-shadow:inset -4px -5px 0 rgba(0,0,0,.3),0 1px 0 #000}
.b.a{background:var(--pumpkin);grid-column:2;grid-row:2}
.b.j{background:#f3e7ea;grid-column:1;grid-row:2}
.b.s{background:var(--rose);grid-column:2;grid-row:1}
@media (pointer:coarse){
  .hint{display:none}
  .screen{width:min(100%, calc((100vh - 250px) * 1.7778));width:min(100%, calc((100dvh - 250px) * 1.7778))}
  .ctrl{display:flex;width:100%;max-width:520px;justify-content:space-between;align-items:center;gap:16px;margin-top:auto;margin-bottom:6px}
}
@media (pointer:coarse) and (orientation:landscape){
  #app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto 1fr;align-items:center;justify-items:center;gap:8px 12px}
  header{grid-column:1/-1;flex-wrap:nowrap;min-width:0}
  h1{order:0;flex-basis:auto}
  .screen{grid-column:2;grid-row:2;width:min(calc((100vh - 64px) * 1.7778), 100%);width:min(calc((100dvh - 64px) * 1.7778), 100%)}
  .ctrl{display:contents}
  .pad{grid-column:1;grid-row:2;width:112px;height:112px}
  .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
  .btns{grid-column:3;grid-row:2;grid-template-columns:repeat(2,56px);grid-template-rows:repeat(2,56px);gap:8px}
  .b{width:56px;height:56px}
}
@media (max-width:520px){h1{order:3;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.b.on{transform:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../../" aria-label="Tornar a l'inici">&lt; JOCS</a>
    <h1>DIMONI DEL <span>TURÓ</span></h1>
    <div class="tg"><button class="sound" id="mus" type="button">MÚSICA: SÍ</button><button class="sound" id="snd" type="button">SO: SÍ</button></div>
  </header>
  <div class="screen"><canvas id="c" width="384" height="216" aria-label="Joc Dimoni del Turó"></canvas></div>
  <p class="hint">
    <span><b class="p1">1 JUGADOR</b> · fletxes o WASD · J cop · K salt · L bossa</span>
    <span><b class="p1">ENRIC</b> · WASD · F cop · G salt · H bossa</span>
    <span><b class="p2">JUGADOR 2</b> · fletxes · , cop · . salt · - bossa (o teclat numèric 1 2 3)</span>
    <span>També amb comandaments</span>
  </p>
  <div class="ctrl">
    <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
    <div class="btns">
      <button class="b s" data-k="s" type="button">BOSSA</button>
      <button class="b j" data-k="j" type="button">SALT</button>
      <button class="b a" data-k="a" type="button">COP</button>
    </div>
  </div>
</div>

<script>
(()=>{
const W=384,H=216,FT=140,FB=206,LEVEL=2740;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.random()*a.length|0];
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};

/* ---------- audio ---------- */
let AC=null,soundOn=true;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
// iOS Safari only unlocks audio on touchend/click, not on pointerdown
['touchend','click'].forEach(n=>addEventListener(n,initAudio,{passive:true}));
function tone(f1,f2,d,type='square',v=.12){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise(d,v){if(!AC||!soundOn)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;s.buffer=NB;const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d)}
const sfx={
  hit(){noise(.09,.35);tone(220,70,.1,'square',.1)},
  swing(){tone(700,250,.06,'triangle',.05)},
  jump(){tone(220,520,.12,'square',.05)},
  hurt(){tone(320,90,.25,'sawtooth',.1)},
  groan(){tone(110,70,.45,'sawtooth',.035)},
  candy(){tone(660,1320,.12,'square',.07);setTimeout(()=>tone(990,1980,.1,'square',.06),70)},
  ko(){tone(180,40,.45,'square',.12);noise(.2,.2)},
  spin(){tone(300,900,.3,'triangle',.08)},
  blip(){tone(880,880,.05,'square',.05)},
  go(){tone(523,523,.09,'square',.07);setTimeout(()=>tone(784,784,.12,'square',.07),110)}
};
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;sndBtn.textContent='SO: '+(soundOn?'SÍ':'NO');initAudio()});

/* ---------- 8-bit music (original chiptune, scheduled with Web Audio) ---------- */
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const n2f=n=>{const m=n.match(/^([A-G])([#b]?)(\d)$/);let s=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(s-69)/12)};
const CH={Am:['A','C','E'],F:['F','A','C'],G:['G','B','D'],Em:['E','G','B'],E:['E','G#','B'],Dm:['D','F','A'],Bb:['Bb','D','F'],C:['C','E','G'],A:['A','C#','E']};
const SONGS={
  main:{bpm:138,chords:['Am','F','G','Em','Am','F','G','E'],mel:[
    'A4 - C5 E5 - D5 C5 B4','C5 - - A4 F4 A4 C5 D5','B4 - D5 G5 - F5 E5 D5','E5 - - - B4 - . .',
    'A4 - C5 E5 - A5 G5 E5','F5 - E5 D5 C5 - A4 C5','D5 - G4 B4 D5 - F5 -','E5 - G#5 - B5 - E5 .']},
  boss:{bpm:158,chords:['Dm','Bb','C','A','Dm','Bb','C','A'],mel:[
    'D5 - F5 A5 - G5 F5 E5','D5 - - Bb4 - D5 F5 -','E5 - G5 C6 - Bb5 A5 G5','A5 - C#6 - E6 - A5 .',
    'D6 - A5 F5 D5 - F5 A5','Bb5 - A5 G5 F5 - D5 F5','G5 - E5 C5 E5 - G5 Bb5','A5 - - - C#6 - E6 -']}
};
let musicOn=true,MG=null,song=null,step=0,nextT=0;
function getNB(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}return NB}
function mg(){if(!MG){MG=AC.createGain();MG.gain.value=musicOn?.55:0;MG.connect(AC.destination)}return MG}
function voice(type,f,t,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(mg());o.start(t);o.stop(t+d+.02)}
function drum(t,kind){if(kind==='k'){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(mg());o.start(t);o.stop(t+.15);return}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),d=kind==='s'?.12:.03;s.buffer=getNB();f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;
  g.gain.setValueAtTime(kind==='s'?.28:.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg());s.start(t,Math.random()*.2);s.stop(t+d)}
function playStep(S,st,t,sd){
  const bar=st>>4,s=st&15,tones=CH[S.chords[bar]],root=tones[0];
  if(s%2===0)voice('triangle',n2f(root+(s%4===0?'2':'3')),t,sd*1.8,.32);
  voice('square',n2f(tones[(s+(s>>2))%3]+(s%6<3?'4':'5')),t,sd*.8,.022);
  if(s%2===0){const toks=S.mel[bar].split(' '),i=s>>1,tk=toks[i];
    if(tk!=='-'&&tk!=='.'){let n=1;while(toks[i+n]==='-')n++;voice('square',n2f(tk),t,sd*2*n*.95,.075);voice('square',n2f(tk)*1.004,t,sd*2*n*.95,.03)}}
  if(s%8===0||(S===SONGS.boss&&s===10))drum(t,'k');if(s===4||s===12)drum(t,'s');if(s%2===1)drum(t,'h');
}
function jingle(notes,sd){if(!AC||!musicOn)return;let t=AC.currentTime+.05;for(const [n,len] of notes){if(n)voice('square',n2f(n),t,sd*len*.95,.08),voice('triangle',n2f(n)/2,t,sd*len*.95,.2);t+=sd*len}}
setInterval(()=>{if(!AC||!song||!musicOn)return;const S=SONGS[song],sd=60/S.bpm/4;
  if(nextT<AC.currentTime-.1)nextT=AC.currentTime+.03;
  while(nextT<AC.currentTime+.15){playStep(S,step,nextT,sd);step=(step+1)%(S.chords.length*16);nextT+=sd}},25);
function setSong(name){if(song===name)return;song=name;step=0;if(AC)nextT=AC.currentTime+.08}
const musBtn=document.getElementById('mus');
musBtn.addEventListener('click',()=>{musicOn=!musicOn;musBtn.textContent='MÚSICA: '+(musicOn?'SÍ':'NO');initAudio();if(MG)MG.gain.value=musicOn?.55:0});

/* ---------- input: keyboard, touch, gamepads ---------- */
const K0=()=>({l:0,r:0,u:0,d:0,a:0,j:0,s:0});
const kb=[K0(),K0()],gp=[K0(),K0()],pe=[{},{}];
const I=(i,k)=>kb[i][k]||gp[i][k];
const press=(i,k)=>{if(!kb[i][k])pe[i][k]=1;kb[i][k]=1}, release=(i,k)=>{kb[i][k]=0};
const KM1={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
  KeyJ:'a',KeyZ:'a',KeyF:'a',Enter:'a',NumpadEnter:'a',Comma:'a',Numpad1:'a',
  KeyK:'j',KeyX:'j',Space:'j',KeyG:'j',Period:'j',Numpad2:'j',
  KeyL:'s',KeyC:'s',KeyH:'s',Slash:'s',Numpad3:'s'};
const KM2A={KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d',KeyF:'a',KeyG:'j',KeyH:'s',Space:'j'};
const KM2B={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',Comma:'a',Period:'j',Slash:'s',Numpad1:'a',Numpad2:'j',Numpad3:'s',Numpad0:'a'};
const held={};let canTwo=matchMedia('(pointer:fine)').matches;
addEventListener('keydown',e=>{
  canTwo=true;initAudio();
  if(state!=='play'&&(e.code==='Digit1'||e.code==='Digit2'||e.code==='Numpad1'||e.code==='Numpad2')&&state==='title'){menuSel=e.code.endsWith('2')?2:1;startGame();e.preventDefault();return}
  let m=null;
  if(state==='play'&&mode===2){if(KM2A[e.code])m=[0,KM2A[e.code]];else if(KM2B[e.code])m=[1,KM2B[e.code]];if(e.code==='Enter')m=[0,'a']}
  else if(KM1[e.code])m=[0,KM1[e.code]];
  if(!m)return;e.preventDefault();if(e.repeat)return;held[e.code]=m;press(m[0],m[1]);
});
addEventListener('keyup',e=>{const m=held[e.code];if(m){release(m[0],m[1]);delete held[e.code]}});
addEventListener('blur',()=>{for(const c in held){release(...held[c]);delete held[c]}});
document.querySelectorAll('.b').forEach(b=>{const k=b.dataset.k;
  const dn=e=>{e.preventDefault();initAudio();press(0,k);b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const up=()=>{release(0,k);b.classList.remove('on')};
  b.addEventListener('pointerdown',dn);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up));
  b.addEventListener('contextmenu',e=>e.preventDefault());});
const pad=document.getElementById('pad'),knob=document.getElementById('knob');let padId=null;
function padMove(e){const r=pad.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy),mx=r.width*.32;if(m>mx){dx*=mx/m;dy*=mx/m}knob.style.transform=`translate(${dx}px,${dy}px)`;
  const dz=12,k=kb[0];k.l=dx<-dz?1:0;k.r=dx>dz?1:0;
  const nu=dy<-dz?1:0,nd=dy>dz?1:0;if(nu&&!k.u)pe[0].u=1;if(nd&&!k.d)pe[0].d=1;k.u=nu;k.d=nd}
pad.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}padMove(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e)});
const padEnd=e=>{if(e.pointerId!==padId)return;padId=null;knob.style.transform='';const k=kb[0];k.l=k.r=k.u=k.d=0};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>pad.addEventListener(n,padEnd));
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();
  if(state==='title'){if(canTwo){const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*H;if(y>100&&y<138){menuSel=y<119?1:2}}startGame()}
  else if(state!=='play')pe[0].a=1});
function pollPads(){
  let pads=[];try{pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[]}catch(e){return}
  if(pads.length)canTwo=true;
  const ns=[K0(),K0()];
  pads.slice(0,2).forEach((g,gi)=>{const pi=mode===2&&state==='play'?gi:0,n=ns[pi],b=i=>g.buttons[i]&&g.buttons[i].pressed?1:0,ax=g.axes[0]||0,ay=g.axes[1]||0;
    n.l|=ax<-.4||b(14);n.r|=ax>.4||b(15);n.u|=ay<-.4||b(12);n.d|=ay>.4||b(13);
    n.a|=b(2)||b(9);n.j|=b(0);n.s|=b(1)||b(3)});
  for(let i=0;i<2;i++)for(const k in ns[i]){const v=ns[i][k]?1:0;if(v&&!gp[i][k])pe[i][k]=1;gp[i][k]=v}
}

/* ---------- prerendered scenery: Barcelona skyline ---------- */
function layer(w,draw){const c=document.createElement('canvas');c.width=w;c.height=H;const g=c.getContext('2d');draw(g,seeded(w),(col,x,y,ww,hh)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh)});return c}
const FAR=layer(700,(g,r,P)=>{
  // banded dusk sky with checker dithering between bands
  const sky=['#1d1731','#251d3d','#30244a','#3e2c55','#52365e','#6a4166','#844e6a','#9f5d6c','#bb6e6f','#d58272','#e99a7e','#f4b48e'];
  const bh=5;sky.forEach((c,i)=>{P(c,0,i*bh,700,bh);if(i){g.fillStyle=sky[i-1];for(let x=(i&1);x<700;x+=2)g.fillRect(x,i*bh,1,1)}});
  P(sky[sky.length-1],0,sky.length*bh,700,20);
  for(let i=0;i<30;i++)P('#f3dfe6',r()*700|0,r()*24|0,1,1);
  // low sun over the sea
  const sx=470,sy=50;[[7,'#ffcf8a'],[5,'#ffe2a8'],[3,'#fff2cf']].forEach(([rr,c])=>{for(let y=-rr;y<=rr;y++){const w=Math.round(Math.sqrt(rr*rr-y*y));P(c,sx-w,sy+y,w*2+1,1)}});
  // blocky clouds
  for(let i=0;i<22;i++){const x=r()*700|0,y=6+r()*36|0,w=18+r()*50|0,c=r()<.5?'#3a2b4f':'#5a3f62';P(c,x,y,w,3);P(c,x+4,y-2,w-10,2);P(c,x+8,y+3,w-14,1);P('#9a6a7c',x+4,y-2,w-14,1)}
  // sea
  P('#6f5f86',0,58,700,8);for(let i=0;i<120;i++)P(r()<.5?'#a07e98':'#8a7398',r()*700|0,59+(r()*7|0),2+(r()*4|0),1);
  for(let x=440;x<500;x+=2)P('#f2b88a',x+(r()*3|0),59+(r()*6|0),2,1);

  for(const t of texts)t.t+=dt;texts=texts.filter(t=>t.t<.9);
  shake=Math.max(0,shake-dt*14);
}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('dimoni-best',best)}catch(e){}}}

/* ---------- drawing ---------- */

  const sl=c.body,hand='#d9a07a';

  else{R(sl,-7,-29,4,6);R(sl,-5,-25,13,4);R(hand,6,-27,4,4);R(hand,3,-26,3,3)}
  const bx=p.st==='spec'?14:p.st==='atk'?-2:1,by=p.st==='spec'?-30:-22;
  R('#ff7a1a',bx+2,by-5,1,5);R('#ff7a1a',bx+8,by-5,1,5);R('#ff7a1a',bx+2,by-5,7,1);
  R('#ff7a1a',bx,by,11,13);R('#121214',bx+1,by+1,9,11);R('#f4f1ec',bx+3,by+5,3,4);R('#121214',bx+4,by+6,1,1);R('#ff7a1a',bx+7,by+8,2,2);R('#ff9a50',bx+2,by+2,6,1);
  R('#0c0c10',-6,-45,13,16);R('#0c0c10',-5,-47,11,3);
  R(c.edge,-2,-45,9,11);R(c.mask,-1,-45,7,10);R(c.hi,0,-44,2,8);R(c.sh,5,-45,2,10);
  R(c.horn,-2,-49,2,4);R(c.hi,-2,-49,1,2);R(c.horn,-3,-51,1,2);R(c.horn,6,-49,2,4);R(c.horn,7,-51,1,2);
  R(c.brow,0,-46,6,1);
  R('#120608',0,-42,2,2);R('#120608',4,-42,2,2);R(c.sh,3,-40,1,2);
  R('#120608',1,-37,5,2);R('#fff3e8',2,-37,1,1);R('#fff3e8',4,-37,1,1);
  ctx.restore();
}
function drawZombie(z){
  const sx=Math.round(z.x-camX),sy=Math.round(z.y-z.z);
  if(z.dead&&z.t>.9&&Math.floor(z.t*16)%2)return;

  if(boss)R(C('#4a2a5a'),-11,-32,6,22);

  R(C(boss?'#3a2a2a':z.type==='r'?'#8a2a2a':z.shirt),tx,-31,tw,17);R(C('rgba(0,0,0,.25)'),tx,-31,3,17);R(C(skin),tx+4,-18,3,3);R(C(skin),tx+tw-5,-24,2,3);
  const atk=z.st==='atk',lunge=atk&&z.t>z.T.wind-.08,arm=atk?(lunge?16:6):12,ay=atk&&!lunge?-34:-29;
  R(C(z.type==='r'?'#8a2a2a':z.shirt),tx+tw-4,ay,4,4);R(C(skin),tx+tw,ay,arm,3);R(C(skin),tx+tw-2,ay+4,arm-1,3);
  if(boss){R(C('#ff7a1a'),-8,-50,16,15);R(C('#e0631a'),-3,-50,1,15);R(C('#e0631a'),3,-50,1,15);R(C('#ffa04a'),-6,-48,2,8);R(C('#3d6b2a'),-1,-53,3,4);
    R(C('#ffe14a'),0,-46,3,3);R(C('#ffe14a'),5,-46,3,3);R(C('#ffe14a'),0,-40,8,2);R(C('#8a3a0a'),1,-40,1,1);R(C('#8a3a0a'),4,-40,1,1);
    R(C('#c9a227'),-6,-55,12,2);R(C('#c9a227'),-6,-58,2,3);R(C('#c9a227'),-1,-59,2,4);R(C('#c9a227'),4,-58,2,3)}
  else{R(C(skin),-4,-43,10,11);R(C('rgba(0,0,0,.18)'),-4,-43,2,11);
    if(z.type!=='b'){R(C('#2a2a20'),-5,-45,10,3);R(C('#2a2a20'),-5,-42,2,4)}

  ctx.restore();

function shadow(x,y,s){ctx.fillStyle='rgba(20,10,20,.35)';ctx.beginPath();ctx.ellipse(Math.round(x-camX),Math.round(y),10*s,3*s,0,0,7);ctx.fill()}
function text(t,x,y,c='#f3e7ea',sz=8,al='left'){ctx.font=`${sz}px "Press Start 2P", monospace`;ctx.textAlign=al;ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(t,x+1,y+1);ctx.fillStyle=c;ctx.fillText(t,x,y)}
function drawScene(){
  ctx.drawImage(FAR,-Math.round(camX*.1),0);ctx.drawImage(MID,-Math.round(camX*.4),0);
  const off=Math.floor(camX)%6;ctx.fillStyle='rgba(52,56,68,.75)';
  for(let x=-off;x<W;x+=6)ctx.fillRect(x,56,1,86);

  R('#6b5a4c',0,138,W,8);for(let x=-(Math.floor(camX)%9);x<W;x+=9)R('#5f7a45',x,136+(x*7&3),2,3);

  for(const d of DECOR){const x=d.x-camX;if(x<-8||x>W+8)continue;if(d.k==='leaf')R(d.c,x|0,d.y|0,3,2);else{R('rgba(60,50,46,.6)',x|0,d.y|0,6,1);R('rgba(60,50,46,.6)',(x|0)+5,(d.y|0)+1,4,1)}}

const demo=[mkP(0),mkP(1)];
function drawTitle(){
  ctx.fillStyle='rgba(15,8,18,.5)';ctx.fillRect(0,0,W,H);
  const two=canTwo&&menuSel===2;
  demo[0].x=two?W/2-24:W/2;demo[0].y=204;demo[0].inv=0;demo[0].st='idle';demo[0].face=1;
  demo[1].x=W/2+24;demo[1].y=204;demo[1].inv=0;demo[1].st='idle';demo[1].face=-1;
  shadow(demo[0].x,demo[0].y,1);drawHero(demo[0]);if(two){shadow(demo[1].x,demo[1].y,1);drawHero(demo[1])}
  text('DIMONI',W/2,22,'#e88672',22,'center');text('DEL TURÓ',W/2,50,'#ff7a1a',14,'center');
  text('Halloween al mirador. Els zombis pugen.',W/2,74,'#f3e7ea',6,'center');
  if(canTwo){
    const opt=(n,label,y)=>{const on=menuSel===n;if(on){R('rgba(255,122,26,.18)',W/2-74,y-4,148,15);text('▶',W/2-66,y,'#ff7a1a',8)}text(label,W/2-50,y,on?'#ffd27a':'#8c7a8a',8)};
    opt(1,'1 JUGADOR',104);opt(2,'2 JUGADORS',123);
    if(Math.floor(clock*2.5)%2)text('ENTER PER COMENÇAR',W/2,139,'#f3e7ea',6,'center');
  }else if(Math.floor(clock*2.5)%2)text('TOCA PER COMENÇAR',W/2,108,'#ffd27a',8,'center');
  if(best)text('RÈCORD '+best,W/2,canTwo?92:126,'#8c7a8a',6,'center');
}
function drawHUD(){
  ctx.fillStyle='rgba(12,6,14,.62)';ctx.fillRect(0,0,W,26);
  PL.forEach((p,i)=>{const x0=6+i*134,bw=mode===2?80:100;
    text(p.name,x0,4,p.pal.hud,8);
    if(p.st==='out'){text('FORA',x0,15,'#8c7a8a',6);return}
    R('#2a1520',x0,14,bw+2,7);R(p.hp>30?'#ffb347':'#ff3b3b',x0+1,15,p.hp/100*bw,5);R('rgba(255,255,255,.35)',x0+1,15,p.hp/100*bw,1);
    for(let k=0;k<p.lives;k++){const x=x0+bw+8+k*11;R(p.pal.mask,x,13,7,8);R(p.pal.horn,x-1,10,2,3);R(p.pal.horn,x+6,10,2,3);R('#120608',x+1,15,2,2);R('#120608',x+4,15,2,2)}
    if(p.hits>=2)text(p.hits+' COPS!',x0,32,'#ffd27a',8)});
  text(String(score).padStart(7,'0'),W-6,4,'#ffd27a',8,'right');
  if(lastHit&&!lastHit.z.gone){const z=lastHit.z,bw=z.type==='boss'?130:70;text(z.T.name,W-6,15,'#9cd67a',6,'right');R('#1c2a14',W-6-bw,30,bw,3);R('#9cd67a',W-6-bw,30,Math.max(0,z.hp)/z.max*bw,3)}
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate(Math.round(rnd(-shake,shake)),Math.round(rnd(-shake,shake)));
  if(state==='title'){camX=0;drawScene();ctx.restore();drawTitle();return}
  drawScene();
  for(const it of items)shadow(it.x,it.y,.5);
  for(const z of Z)shadow(z.x,z.y,z.sc);for(const p of PL)if(p.st!=='out')shadow(p.x,p.y,1);
  for(const it of items){const x=Math.round(it.x-camX),y=Math.round(it.y-8+Math.sin(it.t*5)*2);R('#ff7a1a',x-3,y,6,4);R('#ffd27a',x-5,y+1,2,2);R('#ffd27a',x+3,y+1,2,2);R('#fff',x-2,y+1,1,1)}
  const ents=[...Z.map(z=>({y:z.y,f:()=>drawZombie(z)})),...PL.map(p=>({y:p.y+.01,f:()=>drawHero(p)}))].sort((a,b)=>a.y-b.y);
  for(const e of ents)e.f();
  for(const p of parts)R(p.c,Math.round(p.x-camX),Math.round(p.y),2,2);
  for(const t of texts)text(t.txt,Math.round(t.x-camX),Math.round(t.y-t.t*20),t.c,8,'center');
  ctx.restore();
  drawHUD();
  if(goT>0&&Math.floor(goT*3)%2)text('SEGUEIX ▶',W-10,96,'#ff7a1a',10,'right');
  if(banner)text(banner.txt,W/2,70,'#ff7a1a',14,'center');
  if(state==='over'||state==='win'){ctx.fillStyle='rgba(12,6,14,.72)';ctx.fillRect(0,0,W,H);
    if(state==='over'){text('GAME OVER',W/2,64,'#ff3b3b',18,'center');text('Els zombis guanyen aquesta nit.',W/2,94,'#f3e7ea',6,'center')}
    else{text('MIRADOR NET!',W/2,56,'#ff7a1a',16,'center');text('El Rei Carabassa ha caigut. Bon Halloween!',W/2,86,'#f3e7ea',6,'center')}
    text('PUNTS '+score,W/2,112,'#ffd27a',8,'center');text('RÈCORD '+best,W/2,128,'#8c7a8a',6,'center');
    if(endT>1&&Math.floor(clock*2.5)%2)text(canTwo?'ENTER PER TORNAR-HI':'TOCA PER TORNAR-HI',W/2,152,'#f3e7ea',8,'center')}
}

let last=performance.now();
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;pollPads();
  if(hitstop>0){hitstop-=dt;render()}else{update(dt);render();for(const e of pe)for(const k in e)delete e[k]}
  requestAnimationFrame(loop)}
(document.fonts?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(loop));
})();
