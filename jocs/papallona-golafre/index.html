<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="La Papallona Golafre: vola per la casa dibuixada i menja't els set gelats. Joc per al mòbil de costat.">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<title>La Papallona Golafre</title>
<meta name="theme-color" content="#fbf8f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;900&display=swap">
<style>
/* Layout: one full-screen canvas over the girls' drawing; paper cards for menu and win, HUD pinned to the corners */
:root{
  --paper:#fbf8f4;       /* paper white of the drawings */
  --ink:#3d2950;         /* purple felt-tip */
  --teal:#23a197;        /* butterfly outline */
  --pink:#f0a58f;        /* ice-cream sticker */
  --sun:#f6cf3b;         /* yellow pencil */
  --shade:rgba(61,41,80,.16);
  --f-display:"Grandstander","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#joc{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--paper)}

/* HUD */
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.hud.l{left:calc(12px + env(safe-area-inset-left,0px))}
.hud.r{right:calc(12px + env(safe-area-inset-right,0px));pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--teal);border-radius:999px;
  padding:3px 14px 3px 6px;font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--shade)}
.pill img{width:22px;height:auto;display:block}
.pill.temps{padding:6px 14px;font-weight:700;font-size:18px}
.boto-so{width:44px;height:44px;border-radius:50%;border:3px solid var(--teal);background:var(--paper);color:var(--ink);
  font:700 18px/1 var(--f-display);cursor:pointer;box-shadow:0 3px 0 var(--shade);display:grid;place-items:center}
.boto-tornar{height:44px;display:grid;place-items:center;padding:0 14px;border-radius:22px;border:3px solid var(--teal);background:var(--paper);color:var(--ink);font:900 15px/1 var(--f-display);text-decoration:none;box-shadow:0 3px 0 var(--shade)}
.boto-tornar:focus-visible,.boto-so:focus-visible,.boto:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sala{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;
  font-weight:900;font-size:24px;color:var(--ink);background:var(--sun);padding:4px 18px;border-radius:14px 18px 12px 16px;
  box-shadow:0 3px 0 var(--shade);opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap}
.sala.on{opacity:1}

/* Screens */
.pantalla{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(251,248,244,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.carta{background:var(--paper);border:4px solid var(--teal);border-radius:28px 34px 26px 32px;box-shadow:0 8px 0 var(--shade);
  padding:18px 26px;max-width:min(640px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center}
.carta .pap{width:clamp(110px,22vw,190px);height:auto;grid-row:span 4;animation:vol 2.4s ease-in-out infinite}
h1{margin:0;font-size:clamp(28px,5.4vw,46px);line-height:1;font-weight:900;text-wrap:balance}
h1 span{color:var(--teal)}
.carta p{margin:0;font-size:clamp(15px,2.3vw,19px);line-height:1.35;font-weight:500;max-width:34ch}
.ajuda{display:flex;gap:10px;flex-wrap:wrap}
.ajuda b{display:inline-flex;align-items:center;gap:6px;background:var(--sun);border-radius:12px;padding:3px 10px;font-size:15px;font-weight:700}
.boto{justify-self:start;font:900 26px/1 var(--f-display);color:var(--paper);background:var(--teal);border:0;border-radius:18px 22px 16px 20px;
  padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 var(--ink);margin-top:6px}
.boto:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.rec{font-size:15px;font-weight:700;opacity:.75}
@keyframes vol{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.carta .pap{animation:none}.sala{transition:none}}

.gira{position:fixed;inset:0;z-index:20;background:var(--paper);display:none;place-items:center;text-align:center;padding:24px}
.gira div{font-weight:900;font-size:28px;line-height:1.2}
.gira .mobil{width:70px;height:110px;border:6px solid var(--teal);border-radius:14px;margin:0 auto 18px;animation:gira 1.8s ease-in-out infinite}
@keyframes gira{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){.gira{display:grid}}
</style>
</head>
<body>


<canvas id="joc" aria-label="Joc de la papallona"></canvas>

<div class="hud l" aria-live="polite">
  <div class="pill"><img id="iconaGelat" alt=""><span id="comptador">0 / 7</span></div>
  <div class="pill temps" id="temps">0:00</div>
</div>
<div class="hud r"><a class="boto-tornar" href="../../" aria-label="Tornar a La Recreativa">&lt; JOCS</a><button class="boto-so" id="so" aria-label="So activat">♪</button></div>
<div class="sala" id="sala"></div>

<div class="pantalla" id="inici">
  <div class="carta">
    <img class="pap" id="papInici" alt="La papallona">
    <h1>La Papallona <span>Golafre</span></h1>
    <p>Vola per tota la casa i menja't els 7 gelats amagats. Compte amb els mobles i les escales!</p>
    <div class="ajuda"><b>◀ Toca a l'esquerra: enrere</b><b>Toca a la dreta: endavant ▶</b><b>Toca molt: puja!</b></div>
    <button class="boto" id="juga">Juga!</button>
  </div>
</div>

<div class="pantalla" id="final" hidden>
  <div class="carta">
    <img class="pap" id="papFinal" alt="La papallona contenta">
    <h1>Ho has <span>aconseguit!</span></h1>
    <p id="resultat">T'has menjat tots els gelats.</p>
    <p class="rec" id="record"></p>
    <button class="boto" id="torna">Torna a jugar</button>
  </div>
</div>

<div class="gira"><div><div class="mobil"></div>Gira el mòbil<br>per jugar</div></div>

const ULLS=[{x:959,y:726},{x:1350,y:724}];

  x.lineJoin='round';x.lineCap='round';
  // cucurutx
  x.beginPath();x.moveTo(-16,9);x.quadraticCurveTo(0,13,16,9);x.lineTo(1.5,52);x.quadraticCurveTo(0,55,-1.5,52);x.closePath();
  x.fillStyle='#fde6b8';x.fill();
  x.save();x.clip();x.strokeStyle='#d6609a';x.lineWidth=1.6;
  for(let i=-40;i<40;i+=7){x.beginPath();x.moveTo(i,6);x.lineTo(i+44,60);x.stroke();x.beginPath();x.moveTo(i,6);x.lineTo(i-44,60);x.stroke();}
  x.restore();
  x.strokeStyle='#b8487d';x.lineWidth=2.4;x.beginPath();x.moveTo(-16,9);x.lineTo(1.5,52);x.quadraticCurveTo(0,55,-1.5,52);x.lineTo(16,9);x.stroke();
  // bola amb degoteig
  x.beginPath();x.arc(0,0,19.5,Math.PI*.93,Math.PI*2.07);
  x.bezierCurveTo(19,12,15,13,13,11);x.quadraticCurveTo(11,17,8,12);
  x.quadraticCurveTo(4,10,1,13);x.quadraticCurveTo(-2,20,-5,13);
  x.quadraticCurveTo(-9,10,-12,12);x.quadraticCurveTo(-17,13,-18.7,6);x.closePath();
  const gr=x.createRadialGradient(-6,-8,3,0,0,22);gr.addColorStop(0,'#ffc4b0');gr.addColorStop(1,'#f19a85');
  x.fillStyle=gr;x.fill();x.strokeStyle='#d0705c';x.lineWidth=2.4;x.stroke();
  // brillantor
  x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.ellipse(-9,-10,4.2,2.6,-.6,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(-3.5,-14,1.4,0,Math.PI*2);x.fill();
  // carona
  x.fillStyle='#3d2950';
  for(const ex of [-7,7]){x.beginPath();x.ellipse(ex,1,2.4,2.9,0,0,Math.PI*2);x.fill();}
  x.fillStyle='#fff';for(const ex of [-7,7]){x.beginPath();x.arc(ex-.8,0,.9,0,Math.PI*2);x.fill();}
  x.fillStyle='rgba(255,105,140,.55)';for(const ex of [-12,12]){x.beginPath();x.ellipse(ex,5.5,3.2,2,0,0,Math.PI*2);x.fill();}
  x.strokeStyle='#3d2950';x.lineWidth=1.6;x.beginPath();x.arc(-1.6,4.4,1.8,.1*Math.PI,.9*Math.PI);x.stroke();x.beginPath();x.arc(1.6,4.4,1.8,.1*Math.PI,.9*Math.PI);x.stroke();
  // fideus de colors
  for(const [sx,sy,a,col] of [[-12,-6,.6,'#23a197'],[4,-13,-.4,'#f6cf3b'],[11,-7,.9,'#9b6bd6'],[-2,-8,1.4,'#23a197'],[13,0,-.7,'#f6cf3b']]){
    x.save();x.translate(sx,sy);x.rotate(a);x.fillStyle=col;x.beginPath();x.roundRect?x.roundRect(-2.4,-1,4.8,2,1):x.rect(-2.4,-1,4.8,2);x.fill();x.restore();}
  return c;
}
let gelatImg=null;

// Línia fina que marca per on no es pot passar
function feContorn(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#000';for(const s of SOLIDS)x.fillRect(s.x0,s.y0,s.x1-s.x0,s.y1-s.y0);x.fillRect(0,TERRA,W,H-TERRA);
  const d=x.getImageData(0,0,W,H),px=d.data,N=W*H,sol=new Uint8Array(N);
  for(let i=0;i<N;i++)sol[i]=px[i*4+3]>127?1:0;
  const out=x.createImageData(W,H),o=out.data,G=2;
  const es=(xx,yy)=>xx<0||yy<0||xx>=W||yy>=H||sol[yy*W+xx]===1;
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){
    const i=yy*W+xx; if(!sol[i])continue;
    if(es(xx-G,yy)&&es(xx+G,yy)&&es(xx,yy-G)&&es(xx,yy+G)&&es(xx-G,yy-G)&&es(xx+G,yy+G)&&es(xx-G,yy+G)&&es(xx+G,yy-G))continue;
    o[i*4]=35;o[i*4+1]=161;o[i*4+2]=151;o[i*4+3]=80;
  }
  x.clearRect(0,0,W,H);x.putImageData(out,0,0);return c;
}

function reinicia(){
  gat={x:300,dir:-1,espera:0,pas:0};
  b={x:200,y:1000,vx:0,vy:0,ales:0,cop:0,terra:false,rot:0};
  gelats.forEach(g=>{g.menjat=false;g.pop=0;});
  menjats=0;tJoc=0;particules=[];salaActual='';
  actualitzaHUD();
  cam.x=b.x;cam.y=b.y;
}

// ---- So (Web Audio, s'activa amb el primer toc) ----
function audio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); }
function to(f,d,tipus='sine',vol=.12,f2){
  if(!so||!ac) return; const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=tipus;o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const soAles=()=>to(520,.09,'triangle',.05,760);
const soCop=()=>to(180,.22,'square',.06,70);
const soGelat=()=>{[660,880,1320].forEach((f,i)=>setTimeout(()=>to(f,.16,'triangle',.1),i*70));};
const soFinal=()=>{[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>to(f,.22,'triangle',.11),i*120));};

// ---- Controls ----
function bat(dir){
  if(estat!=='joc') return;
  b.vy=Math.min(b.vy,0)-340; if(b.vy<-420) b.vy=-420;
  b.vx+=dir*190; b.vx=Math.max(-280,Math.min(280,b.vx));
  b.ales=1; soAles();
}
function dirDe(x){return x>=innerWidth/2?1:-1;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();pressio=dirDe(e.clientX);pressioT=0;bat(pressio);try{cv.setPointerCapture(e.pointerId);}catch(_){}} );
cv.addEventListener('pointermove',e=>{if(pressio!==null) pressio=dirDe(e.clientX);});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cv.addEventListener(ev,()=>{pressio=null;}));
addEventListener('keydown',e=>{
  if(e.repeat) return;
  const k=e.key;
  if(k==='ArrowRight'||k==='d'||k==='D'){audio();bat(1);}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){audio();bat(-1);}
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();audio();bat(0);}
  else if(k==='Enter'&&estat!=='joc'){comenca();}
});
$('so').addEventListener('click',()=>{so=!so;$('so').textContent=so?'♪':'×';$('so').setAttribute('aria-label',so?'So activat':'So desactivat');audio();});
$('juga').addEventListener('click',comenca);
$('torna').addEventListener('click',comenca);
function comenca(){
  audio(); reinicia(); estat='joc'; $('inici').hidden=true; $('final').hidden=true; t0=performance.now();
  try{ if(matchMedia('(pointer:coarse)').matches && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
}

// ---- Física ----
function xoca(){
  for(let pass=0;pass<2;pass++){
    for(const s of [...SOLIDS,gatSolid()]){
      const cx=Math.max(s.x0,Math.min(b.x,s.x1)),cy=Math.max(s.y0,Math.min(b.y,s.y1));
      let dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
      if(d2>=R*R) continue;
      let nx,ny,pen;
      if(d2<1e-6){ // centre a dins: surt pel costat més proper
        const o=[[b.x-s.x0,-1,0],[s.x1-b.x,1,0],[b.y-s.y0,0,-1],[s.y1-b.y,0,1]].sort((p,q)=>p[0]-q[0])[0];
        nx=o[1];ny=o[2];pen=o[0]+R;
      } else { const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=R-d; }
      b.x+=nx*pen;b.y+=ny*pen;
      const vn=b.vx*nx+b.vy*ny;
      if(vn<0){
        b.vx-=1.35*vn*nx;b.vy-=1.35*vn*ny;
        if(ny<-.7){b.terra=true;b.vx*=.92;}
        if(-vn>170) cop(-vn);
      }
    }
  }
}
function cop(f){ if(b.cop>0.15) return; b.cop=.45; shake=Math.min(10,f/40); soCop(); }

function pas(dt){
  if(pressio!==null){ pressioT+=dt; if(pressioT>.24){pressioT=0;bat(pressio);} }
  mouGat(dt);
  b.terra=false;
  b.vy+=820*dt; if(b.vy>430) b.vy=430;
  b.vx*=Math.exp(-1.1*dt);
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  // límits de la casa
  if(b.x<R){b.x=R;if(b.vx<0)b.vx*=-.4;} if(b.x>W-R){b.x=W-R;if(b.vx>0)b.vx*=-.4;}
  if(b.y<R){b.y=R;if(b.vy<0)b.vy*=-.3;}
  if(b.y>TERRA-R){b.y=TERRA-R;if(b.vy>0){if(b.vy>220)cop(b.vy);b.vy*=-.25;}b.terra=true;b.vx*=.9;}
  xoca();
  b.ales=Math.max(0,b.ales-dt*3.2); b.cop=Math.max(0,b.cop-dt);
  b.rot+=((b.vx/280)*.3-b.rot)*Math.min(1,dt*8);
  // gelats
  for(const g of gelats){
    if(g.menjat) continue;
    const dx=b.x-g.cx,dy=b.y-(g.cy+10);
    if(dx*dx+dy*dy<44*44){ g.menjat=true;g.pop=1;menjats++;soGelat();esclat(g.cx,g.cy);actualitzaHUD();
      if(menjats===TOTAL) setTimeout(guanya,700); }
  }
  // sala
  const s=SALES.find(r=>r.t(b.x,b.y)).n;
  if(s!==salaActual){ salaActual=s; mostraSala(s); }
}
function esclat(x,y){
  for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,v=80+Math.random()*220;
    particules.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,v:1,c:i%3===0?'#f6cf3b':i%3===1?'#f0a58f':'#23a197',r:5+Math.random()*7,estrella:i%3===0});}
  particules.push({x,y:y-40,vx:0,vy:-70,v:1,text:'+1'});
}
function mostraSala(n){ const el=$('sala'); el.textContent=n; el.classList.add('on'); clearTimeout(salaTimer); salaTimer=setTimeout(()=>el.classList.remove('on'),1600); }
function actualitzaHUD(){ $('comptador').textContent=menjats+' / '+TOTAL; }
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function guanya(){
  if(estat!=='joc') return; estat='final'; soFinal();
  $('resultat').textContent='T’has menjat els '+TOTAL+' gelats en '+fmt(tJoc)+'.';
  let rec=null; try{rec=parseFloat(localStorage.getItem('papallona-record'));}catch(e){}
  let txt='';
  if(!rec||tJoc<rec){ try{localStorage.setItem('papallona-record',String(tJoc));}catch(e){} if(rec) txt='Nou rècord!'; }
  else txt='Rècord: '+fmt(rec);
  $('record').textContent=txt; $('final').hidden=false; $('torna').focus();
}

// ---- Dibuix ----
let esc=1,vw=0,vh=0,dpr=1;
function mida(){
  dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);
  esc=innerHeight/VISTA_H; vw=innerWidth/esc; vh=VISTA_H;
  if(vw>W){esc=innerWidth/W;vw=W;vh=innerHeight/esc;}
}
addEventListener('resize',mida);

function estrella(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}

function dibuixa(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#fbf8f4';ctx.fillRect(0,0,cv.width,cv.height);
  // càmera
  const objX=b.x+b.vx*.35,objY=b.y;
  cam.x+=(objX-cam.x)*.08; cam.y+=(objY-cam.y)*.08;
  let cx=vw>=W?(W-vw)/2:Math.max(0,Math.min(W-vw,cam.x-vw/2));
  let cy=vh>=H?(H-vh)/2:Math.max(0,Math.min(H-vh,cam.y-vh/2));
  if(shake>0){cx+=(Math.random()-.5)*shake;cy+=(Math.random()-.5)*shake;shake*=.85;if(shake<.3)shake=0;}
  ctx.setTransform(esc*dpr,0,0,esc*dpr,-cx*esc*dpr,-cy*esc*dpr);
  ctx.drawImage(mapa,0,0,W,H);
  dibuixaUlls();
  ctx.drawImage(contorn,0,0);
  // gat que camina
  { const bob=gat.espera>0?0:Math.abs(Math.sin(gat.pas*7))*5, inc=gat.espera>0?0:Math.sin(gat.pas*7)*.035;
    ctx.save(); ctx.translate(gat.x+GAT.w/2,GAT.y+GAT.h-bob); ctx.rotate(inc);
    ctx.scale(gat.dir<0?1:-1,1); ctx.drawImage(gatImg,-GAT.w/2,-GAT.h,GAT.w,GAT.h); ctx.restore(); }

  if(DEBUG){ctx.fillStyle='rgba(255,0,80,.28)';for(const s of SOLIDS)ctx.fillRect(s.x0,s.y0,s.x1-s.x0,s.y1-s.y0);const g=gatSolid();ctx.fillRect(g.x0,g.y0,g.x1-g.x0,g.y1-g.y0);}

  // gelats
  for(const g of gelats){
    if(g.menjat&&g.pop<=0) continue;
    const bob=Math.sin(t/420+g.cx)*4, balla=Math.sin(t/260+g.cy)*.08;
    ctx.save();
    ctx.translate(g.cx,g.cy+bob);
    if(g.menjat){const k=1+(1-g.pop)*.8;ctx.globalAlpha=g.pop;ctx.scale(k,k);g.pop-=.05;}
    else{ // halo suau perquè es vegin
      ctx.globalAlpha=.4+.2*Math.sin(t/300+g.cx);ctx.fillStyle='#fff6c8';
      ctx.beginPath();ctx.arc(0,12,40,0,Math.PI*2);ctx.fill();ctx.globalAlpha=g.menjat?g.pop:1;
    }
    ctx.rotate(balla);
    ctx.drawImage(gelatImg,-GEL.ox,-GEL.oy,GEL.w,GEL.h);
    ctx.restore();
  }

  // papallona
  const pw=88,ph=pw*pap.height/pap.width;
  const ala=1-.22*b.ales*Math.abs(Math.sin(t/38))-(b.terra?0:.06*Math.abs(Math.sin(t/160)));
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(b.rot+(b.cop>0?Math.sin(b.cop*40)*.2:0));
  ctx.scale(ala,1);
  ctx.drawImage(pap,-pw/2,-ph*.52,pw,ph);
  ctx.restore();
  if(DEBUG){ctx.strokeStyle='#f00';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.stroke();}

  // partícules
  for(const p of particules){
    ctx.globalAlpha=Math.max(0,p.v);
    if(p.text){ctx.fillStyle='#3d2950';ctx.font='900 40px Grandstander, "Comic Sans MS", sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}
    else if(p.estrella){ctx.fillStyle=p.c;estrella(p.x,p.y,p.r*1.4);}
    else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  }
  ctx.globalAlpha=1;

  // pistes de control als primers segons
  if(estat==='joc'&&tJoc<4){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalAlpha=Math.min(1,(4-tJoc))*.55;
    ctx.fillStyle='#3d2950';ctx.font='900 '+Math.round(innerHeight*.09)+'px Grandstander, "Comic Sans MS", sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('◀ enrere',innerWidth*.22,innerHeight*.78);
    ctx.fillText('endavant ▶',innerWidth*.78,innerHeight*.78);
    ctx.fillRect(innerWidth/2-1.5,innerHeight*.25,3,innerHeight*.6);
    ctx.globalAlpha=1;
  }
}

let ultim=0;
function bucle(t){
  let dt=Math.min(.05,(t-ultim)/1000||0); ultim=t;
  const pausa=innerHeight>innerWidth&&matchMedia('(pointer:coarse)').matches;
  if(estat==='joc'&&!pausa){
    tJoc+=dt; $('temps').textContent=fmt(tJoc);
    let r=dt; while(r>0){const s=Math.min(r,1/120);pas(s);r-=s;}
  } else if(estat==='menu'){ b.y=1000+Math.sin(t/500)*20; b.ales=.6; mouGat(dt); }
  mouUlls(dt);
  for(const p of particules){ if(p.text){p.y+=p.vy*dt;p.v-=dt*1.2;} else {p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.v-=dt*1.3;} }
  particules=particules.filter(p=>p.v>0);
  dibuixa(t);
  requestAnimationFrame(bucle);
}

window.claude?.hot?.snapshot?.(()=>({estat,b,gat,menjats,tJoc,menjatsIds:gelats.map(g=>g.menjat)}));

Promise.all([carrega(IMG_MAPA),carrega(IMG_PAP),carrega(IMG_GAT),]).then(([m,p,gi])=>{
  mapa=m;pap=p;gatImg=gi;contorn=feContorn();gelatImg=feGelat();
  gelats=GELATS_DATA.map(g=>Object.assign({},g,{menjat:false,pop:0}));
  $('papInici').src=IMG_PAP;$('papFinal').src=IMG_PAP;$('iconaGelat').src=gelatImg.toDataURL();
  mida(); reinicia();
  const d=window.claude?.hot?.data;
  if(d&&d.estat==='joc'){Object.assign(b,d.b);if(d.gat)Object.assign(gat,d.gat);menjats=d.menjats;tJoc=d.tJoc;(d.menjatsIds||[]).forEach((v,i)=>{if(gelats[i])gelats[i].menjat=v;});actualitzaHUD();estat='joc';$('inici').hidden=true;}
  requestAnimationFrame(bucle);
});
})();
</script>
