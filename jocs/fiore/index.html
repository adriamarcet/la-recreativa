  padding-right:max(16px,env(safe-area-inset-right,0px));

}
#stage{height:100%;width:100%;display:grid;place-items:center}
#box{position:relative;line-height:0;box-shadow:0 0 0 4px var(--frame),0 0 0 8px #140c26}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#snd{position:absolute;top:0.6%;right:1.5%;width:8%;aspect-ratio:1;max-width:100%;border:0;padding:0;background:transparent;color:var(--accent);cursor:pointer}
#snd svg{width:100%;height:100%;display:block}
#snd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;font:8px/1 "Press Start 2P",ui-monospace,monospace;color:#fff6e0;background:#1a1230;padding:6px 8px;text-decoration:none;border:2px solid #fff6e0}

<script>
(()=>{
const W=180,H=320,FLOOR=214,FX=58,BOXY=231,WIN=16,NSPEED=64;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
const FONT='"Press Start 2P", ui-monospace, monospace';
function txt(s,x,y,size,col,al,sh){
  ctx.font=size+'px '+FONT;ctx.textBaseline='top';ctx.textAlign=al||'left';
  if(sh){ctx.fillStyle=sh;ctx.fillText(s,Math.round(x)+1,Math.round(y)+1)}
  ctx.fillStyle=col;ctx.fillText(s,Math.round(x),Math.round(y));
}
const pad=(n,l)=>String(n).padStart(l,'0');

/* ---------- so ---------- */
let ac=null,muted=false;
try{muted=localStorage.getItem('fiore-mute')==='1'}catch(e){}
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume();if(ac)startMusic()}
function tone(f1,f2,d,type,v){
  if(!ac||muted)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,f){
  if(!ac||muted)return;const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1800;
  s.buffer=b;g.gain.value=v||.15;s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start();
}
const SFX={
  p:()=>{tone(300,90,.1,'square',.06);noise(.08,.12,2500)},
  k:()=>{tone(200,60,.14,'square',.07);noise(.12,.18,1500)},
  h:()=>{tone(140,45,.18,'triangle',.12);noise(.14,.2,900)},
  combo:()=>{[520,660,880,1180].forEach((f,i)=>setTimeout(()=>tone(f,f*1.2,.1,'square',.05),i*60))},
  turbo:()=>{tone(90,900,.5,'sawtooth',.07);noise(.5,.25,3000);setTimeout(()=>tone(900,60,.5,'square',.06),200)},
  ko:()=>{noise(.9,.3,1200);tone(160,30,.9,'sawtooth',.1)},
  win:()=>{[523,659,784,1046,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,f,.14,'square',.05),i*110))},
  late:()=>{tone(330,110,.7,'triangle',.08)},
  go:()=>{tone(400,800,.2,'square',.05)},
  tick:()=>{tone(900,900,.05,'square',.03)}
};
const sfx=k=>{try{SFX[k]()}catch(e){}};

/* ---------- musiqueta (estil Bishi Bashi: ràpida, saltironera i una mica boja) ---------- */
const LEAD=[
  [16,null,19,null,16,19,24,null,23,null,19,null,16,null,14,null],
  [17,null,21,null,17,21,24,null,21,null,17,null,21,null,17,null],
  [19,null,23,null,19,23,26,null,23,null,19,null,14,null,19,null],
  [24,null,19,null,16,null,19,21,23,24,null,19,16,null,null,null],
  [24,null,24,23,21,null,19,null,21,null,23,null,24,null,null,null],
  [21,null,21,19,17,null,21,null,24,null,21,null,17,null,null,null],
  [23,null,23,21,19,null,23,null,26,null,23,null,19,null,null,null],
  [24,19,16,19,24,19,16,19,24,null,12,null,16,19,24,null]
];
const BASS=[[-12,-5],[-7,0],[-5,2],[-12,-5]];
let mStep=0,mNext=0,mTimer=null;
const hz=n=>261.63*Math.pow(2,n/12);
function mTone(t,f1,f2,d,type,v){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
let nbuf=null;
function mNoise(t,d,v,f){
  if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();
  fl.type='highpass';fl.frequency.value=f;s.buffer=nbuf;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+d+.02);
}
function mPlayStep(t,step,sec){
  const bar=Math.floor(step/16)%8,i=step%16,tr=turboT>0?2:0;
  const n=LEAD[bar][i];
  if(n!==null)mTone(t,hz(n+tr),hz(n+tr),.1,'square',.03);
  const b=BASS[bar%4];
  if(i%4===0)mTone(t,hz(b[0]),hz(b[0]),.14,'triangle',.08);
  else if(i%4===2)mTone(t,hz(b[1]),hz(b[1]),.1,'triangle',.06);
  if(i%4===0)mTone(t,150,45,.12,'sine',.14);
  if(i===4||i===12)mNoise(t,.1,.07,1200);
  if(i%2===0)mNoise(t,.03,.025,7000);
  if(bar===7&&i===14)mTone(t,300,1000,.12,'sine',.05);
  if(bar===3&&i===15)mTone(t,900,300,.08,'sine',.04);
}
function musicWanted(){return state==='title'||state==='intro'||state==='play'||state==='cine'}
function musicTick(){
  if(!ac||document.hidden)return;
  if(muted||!musicWanted()||ac.state!=='running'){mNext=ac.currentTime+.05;return}
  if(mNext<ac.currentTime-.3)mNext=ac.currentTime+.05;
  const bpm=(state==='cine'?120:164*(1+.04*Math.min(streak||0,8)))*(turboT>0?1.25:1),sec=60/bpm/4;
  while(mNext<ac.currentTime+.18){mPlayStep(mNext,mStep,sec);mStep++;mNext+=sec}
}
function startMusic(){if(!mTimer&&ac)mTimer=setInterval(musicTick,40)}

/* ---------- màquines (Turbocapitalisme) ---------- */

   dents:[[6,32,12,10,.2],[40,20,14,9,.4],[8,52,14,10,.6],[42,46,12,12,.8]],
   draw(x,y,d,t){const L=x-30;

     for(let r=-16;r<=16;r++){const w=Math.floor(Math.sqrt(256-r*r));R(x-w,y-34+r,w*2,1,r<-10?'#cfd4e4':'#8a93a8')}
     for(let r=-13;r<=13;r++){const w=Math.floor(Math.sqrt(169-r*r));R(x-w,y-34+r,w*2,1,d>.6?'#9ac3e0':'#6fb0e8')}
     R(x-8,y-42,6,3,'#c9e6fb');R(x+3,y-26,5,2,'#4a8fd0');
     const wv=Math.floor(Math.sin(t*5)*2);R(x-10+wv,y-30,8,3,'#ffffff');R(x+2-wv,y-24,8,3,'#e0334a');
     R(L+4,y-3,6,3,'#666');R(L+50,y-3,6,3,'#666');R(L+22,y-9,16,3,'#e0334a');}},
  {name:'CAFETERA',hp:2200,time:40,w:50,h:92,parts:['#2a2a30','#d8344a','#6a4226','#9ac3e0'],dentCol:'#18181c',

     R(L,y-62,50,60,'#2a2a30');R(L+42,y-62,8,60,'#18181c');R(L+4,y-58,42,8,'#d8344a');
     R(L+6,y-56,8,3,'#fff');R(L+34,y-56,6,4,'#ffcc3d');
     R(L+20,y-46,10,6,'#555');R(L+22,y-40,6,6,'#777');
     R(L+10,y-22,30,3,'#555');R(L+16,y-30,18,8,'#f4eede');R(L+18,y-28,14,3,'#6a4226');
     R(L,y-2,50,2,'#18181c');R(L+8,y-14,34,12,'#3a3a42');R(L+10,y-12,30,2,'#d8344a');}},
  {name:'ARCADE',hp:3200,time:45,w:52,h:100,parts:['#2b3fa8','#e8b82a','#1a1f4a','#ff4fa0'],dentCol:'#1a2a78',

   draw(x,y,d,t){const L=x-26;
     R(L,y-100,52,100,'#2b3fa8');R(L+44,y-100,8,100,'#1a2a78');
     R(L,y-100,52,11,'#e8b82a');R(L+3,y-97,46,5,'#a8541a');R(L+6,y-96,10,3,'#fff');R(L+36,y-96,10,3,'#fff');
     R(L+5,y-86,42,34,'#0a0f1c');

       const c=gl?['#ff3a3a','#3aff7a','#3a7bff','#ffffff'][(Math.floor(t*10)+i*3+j)%4]:'#5ad0ff';
       if(gl||((i+j+Math.floor(t*2))%2===0))R(L+9+i*9,y-82+j*7+(gl?(i%2)*3:0),6,4,c);

     R(L+4,y-2,8,2,'#0a0f1c');R(L+40,y-2,8,2,'#0a0f1c');}}
];
const TOTAL=MACHINES.length;
// Frases de la màquina a mesura que la trenques (màx. 22 caràcters)

  ['GARANTIA: FINS AHIR','ELS IOGURTS FUGEN!','NO ES PODIA REPARAR','ERA DE MARCA BLANCA','ADÉU, CUBETES DE GEL','NOVA: 3.999 EUR'],

/* ---------- pòster del turbo ---------- */
const POSTER=new Image();POSTER.src='../../assets/img/fiore-turbo.jpg';
const PIX=document.createElement('canvas'),pix=PIX.getContext('2d');
function drawCine(){
  const t=st,PW=126,PH=168,x0=Math.round((W-PW)/2);

  for(let i=0;i<16;i++){const a=i*Math.PI/8+t*1.5;ctx.strokeStyle=i%2?'rgba(255,204,61,.16)':'rgba(255,79,160,.16)';ctx.beginPath();ctx.moveTo(90,136);ctx.lineTo(90+Math.cos(a)*260,136+Math.sin(a)*260);ctx.stroke()}
  ctx.restore();
  const e=1-Math.pow(1-clamp(t/.4,0,1),3),sh=t>1.3?Math.round(Math.sin(t*70)*1.5):0;
  const y0=Math.round(H+10+(46-H-10)*e),x=x0+sh;
  R(x-4,y0-4,PW+8,PH+8,'#ffcc3d');R(x-2,y0-2,PW+4,PH+4,'#0a0910');

}

/* ---------- joc ---------- */

let M,hp,timeLeft,gauge,stam,streak,tired,buf,combos,shake,flash,koT,tally;

const KEYS={p:{col:'#e8561a',dk:'#8a2e14',label:'PUNY',dmg:3},k:{col:'#3a7be0',dk:'#1f4a99',label:'PATADA',dmg:4},h:{col:'#f5c52a',dk:'#a8861a',label:'CAP',dmg:6}};
const BTN=[{k:'p',x:8,y:262,w:52,h:50},{k:'k',x:64,y:262,w:52,h:50},{k:'h',x:120,y:262,w:52,h:50}];

const CRACK=[];

function startStage(i,keepScore){
  stageN=i;M=MACHINES[i];hp=M.hp;timeLeft=M.time;gauge=keepScore?gauge:0;stam=100;sleepT=0;streak=0;tired=false;buf=[];combos=0;
  shake=0;flash=0;koT=0;parts=[];fxs=[];floats=[];banner=null;pose=null;poseT=0;turboT=0;pressed={};
  M.x=88+M.w/2;stageStart=score;
  const r=lcg(i*977+13);CRACK.length=0;
  for(let c=0;c<7;c++){
    let px=Math.floor(r()*(M.w-8))+4,py=Math.floor(r()*(M.h-14))+8;const d=[];
    for(let s=0;s<9;s++){const dx=Math.floor(r()*5)-1,dy=Math.floor(r()*4)+1;for(let q=0;q<4;q++){px+=Math.sign(dx)||0;py+=q<dy?1:0;d.push([px,py])}}
    CRACK.push(d);
  }
  notes=[];noteT=.9;qi=0;quip=null;
  state='intro';st=0;sfx('go');
}
function newGame(){score=0;gauge=0;newBest=false;startStage(0,false)}

function spawnParts(n,x,y,big){
  for(let i=0;i<n;i++){
    const c=M.parts[Math.floor(Math.random()*M.parts.length)];
    parts.push({x,y,vx:rnd(-1,3.5)*(big?1.8:1),vy:rnd(-3.5,-.5)*(big?1.6:1),w:Math.random()<.5?2:3,h:Math.random()<.5?2:3,c,g:.22,life:big?5:1.2,spark:false});
  }
}
function spawnSparks(n,x,y){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-2.5,3),vy:rnd(-3,.5),w:1,h:1,c:Math.random()<.5?'#ffe45a':'#fff',g:.15,life:.35,spark:true});
}
function popBanner(t,c,s){banner={t,c,s:s||12,time:1.1,max:1.1}}
function addFloat(t,x,y,c){if(floats.length<4)floats.push({t,x,y,c,time:.7})}

function hitPoint(){return{x:M.x-M.w/2+rnd(0,6),y:FLOOR-M.h*rnd(.25,.85)}}

function dealDamage(d){
  hp=Math.max(0,hp-d);
  if(hp<=0&&state==='play')ko();
}
function failGroup(g,msg){
  if(g.failed)return;
  g.failed=true;streak=0;addFloat(msg||'FALLAT!',6,BOXY-30,'#ff7a7a');
  for(const r of g.pieces)r.st=r.st==='lock'?'gone':(r.st==='gone'?'gone':'miss');
}
function act(k){
  if(state!=='play'||sleepT>0)return;
  initAudio();
  const on=turboT>0,kd=KEYS[k];
  // una pitjada errònia mentre una peça és a l'encaix trenca el combo
  for(const g of notes){
    if(g.failed||g.done)continue;
    const q=g.pieces.find(q=>q.st==='fall');
    if(q&&Math.abs(q.y-BOXY)<=WIN&&q.k!==k){failGroup(g,'ERROR!');break}
  }
  // energia: picar a saco et cansa (excepte al mode turbo)
  const f=on?3:.25+.75*Math.pow(stam/100,1.2),dmg=kd.dmg*f;
  if(!on){stam=Math.max(0,stam-7);if(stam<20&&!tired){tired=true;addFloat('CANSAT!',FX+12,FLOOR-62,'#7ab0ff')}
    if(stam<=0){sleepT=3;tired=false;pose=null;popBanner('ZZZ... ADORMIT!','#7ab0ff',10)}}
  pose=k;poseT=.16;pressed[k]=.1;
  const hp0=hitPoint();
  fxs.push({x:hp0.x,y:hp0.y,t:.14,big:(k==='h'?1.4:1)*(on?1.4:1)});
  spawnSparks(k==='h'?6:4,hp0.x,hp0.y);spawnParts(k==='h'?3:2,hp0.x,hp0.y);
  shake=Math.max(shake,(k==='h'?4:2.2)*(on?1.4:1));
  score+=on?15:5;
  sfx(k);
  dealDamage(dmg);
  if(state!=='play')return;
  tryLock(k);
}
const PNAME={p:'TRIPLE PUNY!',k:'TRIPLE PATADA!',h:'TRIPLE CAP!'};
function tryLock(k){
  for(const g of notes){
    if(g.failed||g.done)continue;
    const p=g.pieces.find(q=>q.st==='fall');
    if(!p)continue;
    const dy=Math.abs(p.y-BOXY);
    if(dy>WIN||p.k!==k)continue;
    p.st='lock';p.dy=dy;g.locks++;
    tone(900+g.locks*250,1500+g.locks*250,.08,'square',.05);
    if(g.locks===3)comboDone(g);
    return;
  }
}
function comboDone(g){
  g.done=true;g.t=.35;combos++;const sk=streak;streak++;
  const [a,b,c]=g.pieces.map(q=>q.k),perfect=g.pieces.every(q=>q.dy<=6),f=(perfect?1.6:1)*(1+.1*Math.min(sk,5));
  let name,bd,pts,gg,col;
  if(a===b&&b===c){name=PNAME[a];bd={p:120,k:160,h:200}[a];pts={p:300,k:450,h:600}[a];gg=20;col=a==='k'?'#7ab0ff':KEYS[a].col}
  else if(a!==b&&b!==c&&a!==c){name='COMBO TOTAL!';bd=260;pts=900;gg=30;col='#ff4fa0'}
  else{name='RÀFEGA!';bd=90;pts=250;gg=12;col='#ffe45a'}
  const p=hitPoint();
  score+=Math.round(pts*(perfect?1.6:1)*(1+.5*Math.min(sk,4)));gauge=Math.min(100,gauge+gg+(perfect?10:0));
  shake=Math.max(shake,perfect?9:6);flash=.18;fxs.push({x:p.x,y:p.y,t:.22,big:perfect?2.6:2});
  spawnSparks(12,p.x,p.y);spawnParts(8,p.x,p.y);
  popBanner(name,col,name.length>12?10:12);
  if(sk>0)addFloat('RATXA x'+streak,6,BOXY-40,'#ffcc3d');
  addFloat(perfect?'PERFECTE!':'BÉ!',6,BOXY-30,perfect?'#ffcc3d':'#fff6e0');
  sfx('combo');
  dealDamage(Math.round(bd*f));
}
function turbo(){
  if(state!=='play'||gauge<100||turboT>0)return;
  sleepT=0;state='cine';st=0;notes=[];sfx('turbo');
}
function beginTurbo(){
  state='play';st=0;turboT=5;stam=100;pose='t';poseT=.7;shake=14;flash=.7;rayT=.9;
  popBanner('TURBOCAPITALISME!','#ffcc3d',10);score+=1000;
  for(let i=0;i<8;i++){const p=hitPoint();fxs.push({x:p.x,y:p.y,t:.25+i*.06,big:2.8});spawnParts(8,p.x,p.y,true);spawnSparks(8,p.x,p.y)}
  dealDamage(120);
}
function ko(){
  sleepT=0;state='ko';koT=0;st=0;banner=null;floats=[];notes=[];turboT=0;
  const t=Math.ceil(timeLeft);
  tally={time:t*100,perfect:combos>=6};
  score+=tally.time+(tally.perfect?1000:0);
  shake=14;flash=.7;sfx('ko');
  for(let i=0;i<6;i++){const p=hitPoint();fxs.push({x:p.x,y:p.y,t:.3+i*.06,big:3});}
  for(let i=0;i<5;i++)spawnParts(14,M.x+rnd(-M.w/3,M.w/3),FLOOR-M.h*rnd(.2,.9),true);
  spawnSparks(30,M.x,FLOOR-M.h/2);
  if(score>best){best=score;newBest=true;try{localStorage.setItem('fiore-best',String(best))}catch(e){}}
}

/* ---------- actualització ---------- */
function update(dt){
  st+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(flash>0)flash-=dt;
  if(poseT>0){poseT-=dt;if(poseT<=0)pose=null}
  for(const k in pressed)if(pressed[k]>0)pressed[k]-=dt;
  if(banner){banner.time-=dt;if(banner.time<=0)banner=null}
  floats=floats.filter(f=>(f.y-=dt*24,(f.time-=dt)>0));
  fxs=fxs.filter(f=>(f.t-=dt)>0);
  const sl=state==='ko'&&st<.8?.35:1,pd=dt*60*sl;
  parts=parts.filter(p=>{
    p.vy+=p.g*pd;p.x+=p.vx*pd;p.y+=p.vy*pd;
    if(!p.spark){const fl=FLOOR+4+((p.x*7)%14);if(p.y>=fl){p.y=fl;p.vy=-p.vy*.3;p.vx*=.6;if(Math.abs(p.vy)<.4)p.vy=0}}
    return(p.life-=dt)>0;
  });
  if(state==='play'){
    if(rayT>0)rayT-=dt;
    if(turboT>0){turboT-=dt;stam=100;gauge=Math.max(0,turboT/5*100);if(turboT<=0){turboT=0;gauge=0;noteT=1.4;popBanner('FI DEL TURBO','#fff6e0',10)}}
    else if(sleepT>0){sleepT-=dt;stam=Math.min(100,stam+20*dt);if(sleepT<=0){sleepT=0;stam=Math.max(stam,60);addFloat('DESPERT!',FX+12,FLOOR-62,'#fff6e0')}}
    else{stam=Math.min(100,stam+16*dt);if(stam>45)tired=false}
    timeLeft-=dt;
    if(quip){quip.time-=dt;if(quip.time<=0)quip=null}
    {const dq=1-hp/M.hp;let q=-1;while(qi<QTH.length&&dq>=QTH[qi]){q=qi;qi++}
     if(q>=0)quip={t:QUIPS[stageN][q],lines:wrap(QUIPS[stageN][q],15),time:2.8}}
    const sf=1+.12*Math.min(streak,8);laneY=(laneY+NSPEED*sf*dt)%16;
    if(turboT<=0)noteT-=dt;
    if(noteT<=0&&timeLeft>4&&turboT<=0){
      const K=['p','k','h'];
      notes.push({pieces:[0,1,2].map(i=>({k:K[Math.floor(Math.random()*3)],y:100-i*34,st:'fall',dy:99})),locks:0,failed:false,done:false,t:0});
      noteT=rnd(3,3.8)/sf;
    }
    for(const g of notes){
      if(g.done){g.t-=dt;continue}
      for(const q of g.pieces){
        if(q.st==='lock'||q.st==='gone')continue;
        q.y+=NSPEED*sf*dt;
        if(q.st==='fall'&&q.y>BOXY+WIN&&!g.failed)failGroup(g,'FALLAT!');
      }
    }
    notes=notes.filter(g=>g.done?g.t>0:g.pieces.some(q=>q.st!=='gone'&&q.y<250));
    const dm=1-hp/M.hp;
    if(dm>.35&&Math.random()<dt*10*dm)parts.push({x:M.x+rnd(-M.w/3,M.w/3),y:FLOOR-M.h,vx:rnd(-.2,.2),vy:-rnd(.4,.9),w:3,h:3,c:'#6b6b73',g:-.01,life:1.2,spark:true});
    if(dm>.7&&Math.random()<dt*3)spawnSparks(3,M.x+rnd(-M.w/3,M.w/3),FLOOR-M.h*rnd(.3,1));
    if(Math.ceil(timeLeft)<=5&&Math.ceil(timeLeft)!==Math.ceil(timeLeft+dt))sfx('tick');
    if(timeLeft<=0){timeLeft=0;state='late';st=0;notes=[];turboT=0;sleepT=0;sfx('late');shake=0}
  }else if(state==='cine'){
  }else if(state==='intro'){
    if(st>1.9){state='play';st=0;sfx('go')}
  }else if(state==='ko'){koT+=dt}
}

/* ---------- dibuix: Fiore (caricatura en pixel art) ---------- */

  const Q=(dx,dy,w,h,c)=>R(x+dx,y+dy,w,h,c);

  const B=p==='z'?4:((!p&&Math.floor(t*3)%2)?1:0);
  let lean=p==='z'?-3:0,hd=p==='z'?3:0,mouth=false;
  if(p==='p'){lean=2;mouth=true}else if(p==='k'){lean=-2;mouth=true}else if(p==='h'){lean=5;hd=5;mouth=true}else if(p==='t'||p==='w'){mouth=true}

  if(p==='k'){
    Q(-8,-17,6,14,JE);Q(-9,-3,9,3,SH);Q(-9,-1,9,1,SO);
    Q(-1,-25,17,7,JE);Q(-1,-25,17,2,JEL);Q(15,-27,9,9,SH);Q(15,-19,9,1,SO);
  }else{
    Q(-8,-17,6,14,JE);Q(1,-17,6,14,JE);Q(-8,-17,2,14,JEL);Q(1,-17,2,14,JEL);
    Q(-9,-3,9,3,SH);Q(1,-3,10,3,SH);Q(-9,-1,9,1,SO);Q(1,-1,10,1,SO);Q(-5,-3,5,1,'#8a98b3');Q(5,-3,5,1,'#8a98b3');
  }
  // braç del darrere
  if(p==='w'||p==='t'){Q(-12,-44,4,12,JS);Q(-12,-47,4,3,SK)}else{Q(-12+lean,-33+B,4,13,JS);Q(-12+lean,-21+B,4,3,SK)}
  // tors (jaqueta d'plomes gris)
  Q(-9+lean,-34+B,18,18,J);Q(6+lean,-34+B,3,18,JS);Q(-9+lean,-19+B,18,3,JS);
  Q(-9+lean,-28+B,18,1,JS);Q(-9+lean,-23+B,18,1,JS);
  Q(3+lean,-34+B,1,18,JD);Q(-6+lean,-30+B,5,1,JD);Q(-7+lean,-36+B,14,4,JS);
  // cap
  const h=lean+hd;
  Q(-5+h,-47+B,11,11,SK);Q(-5+h,-37+B,11,1,SKS);
  Q(-6+h,-51+B,13,5,HR);Q(-6+h,-47+B,3,7,HR);Q(-3+h,-51+B,6,1,HRL);Q(1+h,-49+B,5,1,HRL);
  Q(-5+h,-42+B,2,3,SKS);
  Q(2+h,-44+B,3,1,HR);if(p==='z')Q(2+h,-42+B,3,1,'#1a1a1a');else Q(2+h,-43+B,2,2,'#1a1a1a');
  Q(6+h,-41+B,2,3,SKS);
  if(mouth){Q(3+h,-39+B,4,3,'#5a2a2a');Q(3+h,-39+B,4,1,'#f4eede')}else Q(3+h,-38+B,3,1,'#8a4a3a');
  // braç del davant
  if(p==='p'){
    Q(8+lean,-33,12,5,J);Q(18+lean,-33,2,5,JS);Q(20+lean,-34,6,7,SK);Q(25+lean,-34,1,7,SKS);
  }else if(p==='t'){
    Q(8,-36,12,5,J);Q(18,-36,2,5,JS);Q(20,-37,7,7,SK);Q(8,-29,12,5,J);Q(20,-30,7,7,SK);
  }else if(p==='w'){
    Q(8,-44,4,12,J);Q(8,-47,4,3,SK);
  }else if(p==='k'){
    Q(8+lean,-30,4,9,J);Q(8+lean,-22,4,3,SK);
  }else{
    Q(8+lean,-33+B,4,12,J);Q(8+lean,-23+B,4,2,JS);Q(8+lean,-21+B,4,3,SK);
  }
  if(p==='t'){const f=Math.floor(t*20)%2;for(let i=0;i<8;i++)Q(-14-i*2%6,-48+i*6+f,2,4,i%2?'#ffcc3d':'#ff7a2a')}
  if(!sc&&state==='play'&&stam<30&&turboT<=0){const d=Math.floor(t*6)%3;Q(-9,-46+d*2,1,2,'#7ab0ff');Q(9+hd+lean,-48+((d+1)%3)*2,1,2,'#7ab0ff')}

function drawMachine(){
  const dm=clamp(1-hp/M.hp,0,1);
  const sx=state==='play'?Math.round(Math.sin(st*80)*Math.min(2,shake*.4)):0;
  const x=M.x+sx,y=FLOOR;
  M.draw(x,y,dm,st);
  const L=x-M.w/2;
  for(const d of M.dents)if(dm>d[4])R(L+d[0],y-M.h+d[1],d[2],d[3],M.dentCol);
  const n=CRACK.length;let rem=Math.floor(dm*dm*0+dm*n*40);
  for(let c=0;c<n&&rem>0;c++){const cr=CRACK[c];for(let i=0;i<cr.length&&rem>0;i++,rem--)R(L+cr[i][0],y-M.h+cr[i][1],1,1,'#101014')}

function wrap(s,n){const L=[];let c='';for(const x of s.split(' ')){if((c+' '+x).trim().length>n&&c){L.push(c);c=x}else c=(c+' '+x).trim()}if(c)L.push(c);return L}
function drawBubble(){
  if(!quip||state!=='play')return;
  if(quip.time<=.5&&!(Math.floor(quip.time*10)%2))return;
  const L=quip.lines,wpx=Math.max(...L.map(l=>l.length))*8+10,h=L.length*11+6;
  const bx=Math.round(clamp(M.x-wpx/2,54,176-wpx)),by=Math.max(64,Math.round(FLOOR-M.h-9-h));
  const tx=Math.round(clamp(M.x,bx+9,bx+wpx-9)),ty=by+h,D='#0a0910',Lt='#fff6e0';
  R(bx-2,by-2,wpx+4,h+4,D);R(bx,by,wpx,h,Lt);
  for(let r=0;r<6;r++)R(tx-5+r,ty+r,11-2*r,1,D);
  for(let r=0;r<4;r++)R(tx-3+r,ty+r,7-2*r,1,Lt);
  L.forEach((l,i)=>txt(l,bx+wpx/2,by+4+i*11,8,'#2a1d45','center'));
}
function drawHUD(){
  txt('ETAPA '+(stageN+1)+'/'+TOTAL,6,6,8,'#fff6e0','left','#0a0910');
  txt(pad(score,6),154,6,8,'#ffcc3d','right','#0a0910');
  const low=timeLeft<=10&&state==='play',blink=low&&Math.floor(st*4)%2;
  txt(pad(Math.ceil(timeLeft),2),90,18,24,blink?'#ff3a3a':(low?'#ff7a2a':'#ffffff'),'center','#0a0910');
  const bx=8,bw=164;
  R(bx-2,47,bw+4,14,'#0a0910');R(bx,49,bw,10,'#4a1a1a');
  R(bx,49,Math.round(bw*hp/M.hp),10,'#ffcc3d');R(bx,49,Math.round(bw*hp/M.hp),3,'#fff2a0');
  R(bx,56,Math.round(bw*hp/M.hp),3,'#d89a1a');
  txt(M.name,bx+2,50,8,'#fff6e0','left','#0a0910');
  txt(Math.round(100-100*hp/M.hp)+'%',bx+bw-2,50,8,'#fff6e0','right','#0a0910');
  drawBubble();
}
const GLYPH={
  p:['.#.#.#.','#######','#######','#######','.#####.','.#####.','..###..'],
  k:['.##....','.##....','.##....','.##....','.#####.','.######','.######'],
  h:['.#####.','#######','#.###.#','#######','#.###.#','.#####.','..###..']
};
function glyph(k,x,y,c){const g=GLYPH[k];for(let j=0;j<7;j++)for(let i=0;i<7;i++)if(g[j][i]==='#')R(x+i,y+j,1,1,c)}
function drawStrip(){
  R(6,104,44,136,'rgba(10,6,24,.5)');R(6,104,1,136,'#5a3f8a');R(49,104,1,136,'#5a3f8a');
  for(let y=104+laneY;y<222;y+=16)R(8,Math.round(y),40,1,'rgba(255,255,255,.08)');
  const nowIn=[false,false,false];let lockedCols=[null,null,null];
  ctx.save();ctx.beginPath();ctx.rect(7,104,42,136);ctx.clip();
  for(const g of notes){
    if(g.done){const a=Math.max(0,g.t/.35);R(8,BOXY-8,40,16,'rgba(255,255,255,'+a.toFixed(2)+')')}
    g.pieces.forEach((q,i)=>{
      if(q.st==='lock'||g.done)lockedCols[i]=q.k;
      if(q.st==='lock'||q.st==='gone')return;
      const near=q.st==='fall'&&Math.abs(q.y-BOXY)<=WIN;
      if(near)nowIn[i]=true;
      const x=10+i*14,y=Math.round(q.y)-6;
      R(x-1,y-1,12,12,near?'#ffffff':'#0a0910');
      R(x,y,10,10,q.st==='miss'?'#55506a':KEYS[q.k].col);
      glyph(q.k,x+2,y+2,q.st==='miss'?'#2a2638':'#0a0910');
    });
  }
  ctx.restore();
  for(let i=0;i<3;i++){
    const x=10+i*14,fc=nowIn[i]?(Math.floor(st*10)%2?'#ffffff':'#ffcc3d'):'#5a3f8a';
    R(x-2,224,14,1,fc);R(x-2,237,14,1,fc);R(x-2,224,1,14,fc);R(x+11,224,1,14,fc);
    R(x-1,225,12,1,'#0a0910');R(x-1,236,12,1,'#0a0910');R(x-1,225,1,12,'#0a0910');R(x+10,225,1,12,'#0a0910');
    if(lockedCols[i]){R(x,226,10,10,KEYS[lockedCols[i]].col);glyph(lockedCols[i],x+2,228,'#0a0910')}
  }
  txt('ENERGIA',58,222,8,'#fff6e0','left','#0a0910');
  const tb=turboT>0,low=stam<25&&!tb;
  R(117,221,56,10,'#0a0910');R(118,222,54,8,'#2a1d45');
  R(118,222,Math.round(54*stam/100),8,tb?(Math.floor(st*10)%2?'#ffcc3d':'#ff7a2a'):(low?(Math.floor(st*6)%2?'#ff3a3a':'#a82424'):(stam<55?'#f5c52a':'#5fd04a')));
  if(streak>0)txt('RATXA x'+streak+(streak>1?' >>':''),58,233,8,'#ffcc3d','left','#0a0910');
  if(stageN===0&&state==='play'&&st<9&&!quip)txt('ENCAIXA LES ICONES!',90,106,8,'#fff6e0','center','#0a0910');
}
function drawBanner(){
  if(!banner)return;
  const k=1-banner.time/banner.max,sz=Math.round(banner.s*(k<.15?.6+k*2.6:1)),y=140-Math.round(k*10);
  txt(banner.t,90,y,Math.max(8,sz),banner.c,'center','#0a0910');
}
function draw(){
  const t=performance.now()/1000;
  ctx.setTransform(1,0,0,1,0,0);
  drawBackdrop(t);
  const sh=shake>0?Math.round(shake):0;
  ctx.save();if(sh)ctx.translate(Math.round(rnd(-sh,sh)),Math.round(rnd(-sh,sh)));
  if(state!=='title'&&state!=='win'){
    if(!(state==='ko'&&koT>.15))drawMachine();
  }
  // Fiore
  if(state==='title'){
    drawFiore(90,218,null,t,2);
  }else if(state==='win'){
    drawFiore(90,196,'w',t,1.5);
  }else{
    let fx=FX,pp=pose;
    if(pp==='p')fx+=4;else if(pp==='k')fx+=4;else if(pp==='h')fx+=10;else if(pp==='t')fx+=8;
    if(state==='ko'&&koT>.6)pp='w';
    if(state==='late')pp=null;
    if(sleepT>0)pp='z';
    drawFiore(fx,FLOOR+4,pp,t);
    if(sleepT>0)for(let i=0;i<3;i++){const ph=(t*1.4+i*.33)%1;txt('Z',fx+8+i*5+Math.round(ph*6),FLOOR-48-Math.round(ph*26),8+i*2,'#fff6e0','left','#0a0910')}
  }
  if(rayT>0){
    ctx.save();ctx.lineWidth=4;
    for(let i=0;i<14;i++){const a=i*Math.PI/7+t*3;ctx.strokeStyle=i%2?'rgba(255,255,255,.55)':'rgba(255,204,61,.55)';ctx.beginPath();ctx.moveTo(M.x,FLOOR-M.h/2);ctx.lineTo(M.x+Math.cos(a)*150,FLOOR-M.h/2+Math.sin(a)*150);ctx.stroke()}
    ctx.restore();
  }
  if(turboT>0){
    for(let i=0;i<9;i++){const f=Math.floor(t*16+i*3);R(FX-18+((f*7)%40),FLOOR-6-((f*11+i*9)%58),2,5+(i%3)*3,i%2?'#ffcc3d':'#ff7a2a')}
    ctx.fillStyle='rgba(255,122,42,'+(.08+.06*Math.sin(t*30))+')';ctx.fillRect(0,0,W,FLOOR+14);
  }
  drawFx();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.8,flash*2.2)+')';ctx.fillRect(0,0,W,H)}
  if(floats.length)for(const f of floats)txt(f.t,f.x,f.y,8,f.c,'left','#0a0910');
  if(state==='title')drawTitle(t);
  else{
    drawHUD();drawStrip();drawButtons();drawBanner();
    if(state==='cine')drawCine();
    if(state==='intro')drawIntro();
    else if(state==='ko')drawKo();
    else if(state==='late')drawLate();
    else if(state==='win')drawWin();
  }
}
function blinkTxt(s,y,c){if(Math.floor(performance.now()/450)%2)txt(s,90,y,8,c||'#fff6e0','center','#0a0910')}
function drawTitle(t){
  R(0,0,W,120,'rgba(20,12,38,.35)');
  R(8,6,164,68,'#140c26');R(8,6,164,2,'#ffcc3d');R(8,72,164,2,'#ffcc3d');
  txt('FIORE',90,14,24,'#ffcc3d','center','#d8344a');
  txt('CONTRA EL',90,46,8,'#ff9ac8','center');
  txt('TURBOCAPITALISME',90,58,10,'#ffffff','center','#d8344a');
  R(0,236,W,84,'#140c26');R(0,236,W,2,'#ffcc3d');
  txt('TRENCA LES MÀQUINES',90,246,8,'#ffcc3d','center');
  txt('DEL CAPITAL!',90,258,8,'#ff9ac8','center');
  txt('PUNY, PATADA I CAP.',90,274,8,'#fff6e0','center');
  txt("ENCAIXA'LS = COMBOS!",90,286,8,'#fff6e0','center');
  txt('A SACO NOMES AL TURBO',90,298,8,'#ffcc3d','center');
  blinkTxt('TOCA PER JUGAR',310,'#ffcc3d');
  if(best)txt('REC '+pad(best,6),90,80,8,'#ffcc3d','center','#0a0910');
}
function drawIntro(){
  R(0,112,W,58,'rgba(20,12,38,.8)');R(0,112,W,2,'#ff4fa0');R(0,168,W,2,'#ff4fa0');
  txt('ETAPA BONUS '+(stageN+1),90,120,8,'#ff9ac8','center');
  txt(M.name,90,134,16,'#ffcc3d','center','#d8344a');
  if(st<1.2)txt('PREPARAT!',90,156,8,'#fff6e0','center');
  else txt('ROMP-LA!',90,156,8,'#ff3a3a','center');
  if(stageN===0&&st<1.2)txt('APRETA A SACO!',90,104,8,'#fff6e0','center','#0a0910');
}
function drawKo(){
  if(koT<.3)return;
  if(koT<1.4){txt('K.O.!',90,126,24,'#ff3a3a','center','#ffffff');return}
  R(8,100,164,126,'#140c26');R(8,100,164,2,'#ffcc3d');R(8,224,164,2,'#ffcc3d');
  txt(M.name+' TRENCADA!',90,108,8,'#ffcc3d','center');
  txt('TEMPS',18,128,8,'#fff6e0');txt('+'+tally.time,162,128,8,'#fff6e0','right');
  txt('COMBOS',18,142,8,'#fff6e0');txt('x'+combos,162,142,8,'#fff6e0','right');
  if(tally.perfect){txt('A SACO!',18,156,8,'#ff4fa0');txt('+1000',162,156,8,'#ff4fa0','right')}
  txt('PUNTS',18,176,8,'#ffcc3d');txt(pad(score,6),162,176,8,'#ffcc3d','right');
  if(newBest)txt('NOU RÈCORD!',90,194,8,'#ff4fa0','center');
  if(koT>1.9)blinkTxt(stageN<TOTAL-1?'TOCA: SEGÜENT':'TOCA PER CONTINUAR',208,'#ffcc3d');
}
function drawLate(){
  R(8,104,164,112,'#140c26');R(8,104,164,2,'#ff3a3a');R(8,214,164,2,'#ff3a3a');
  txt('TEMPS!',90,114,16,'#ff3a3a','center','#0a0910');
  txt(M.name+' ENCARA',90,142,8,'#fff6e0','center');
  txt('EN PEU: '+Math.round(100*hp/M.hp)+'%',90,156,8,'#ff9ac8','center');
  txt('LA MÀQUINA GUANYA',90,174,8,'#fff6e0','center');
  txt('(PER ARA...)',90,186,8,'#fff6e0','center');
  if(st>.8)blinkTxt('TOCA: TORNA-HI',201,'#ffcc3d');
}
function drawWin(){
  R(8,64,164,94,'rgba(20,12,38,.92)');R(8,64,164,2,'#ffcc3d');R(8,156,164,2,'#ffcc3d');
  txt('HAS GUANYAT!',90,72,12,'#ffcc3d','center','#d8344a');
  txt('EL TURBOCAPITALISME',90,92,8,'#fff6e0','center');
  txt('ÉS FET PEÇES.',90,104,8,'#fff6e0','center');
  txt('PUNTS '+pad(score,6),90,120,8,'#ffcc3d','center');
  if(newBest)txt('NOU RÈCORD!',90,134,8,'#ff4fa0','center');
  else txt('REC '+pad(best,6),90,134,8,'#ff9ac8','center');
  if(st>1)blinkTxt('TOCA PER TORNAR-HI',146,'#ffcc3d');
}

/* ---------- entrada ---------- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function tapAdvance(){
  initAudio();
  if(state==='title')newGame();
  else if(state==='ko'&&koT>1.9){if(stageN<TOTAL-1)startStage(stageN+1,true);else{state='win';st=0;sfx('win')}}
  else if(state==='late'&&st>.8){score=stageStart;startStage(stageN,true)}
  else if(state==='cine'&&st>1.5)beginTurbo();
  else if(state==='win'&&st>1){state='title';st=0}
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const p=pos(e);
  if(state==='play'){
    for(const b of BTN)if(p.x>=b.x-3&&p.x<=b.x+b.w+3&&p.y>=b.y-3&&p.y<=b.y+b.h+3){act(b.k);return}
    const s=SUPER;if(p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y-3&&p.y<=s.y+s.h+3)turbo();
  }else tapAdvance();
});
const KM={KeyZ:'p',KeyJ:'p',KeyA:'p',KeyX:'k',KeyK:'k',KeyS:'k',KeyC:'h',KeyL:'h',KeyD:'h'};
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=KM[e.code];
  if(state==='cine'&&(k||e.code==='Space'||e.code==='Enter')){e.preventDefault();tapAdvance();return}
  if(k){e.preventDefault();act(k);return}
  if(e.code==='Space'||e.code==='Enter'){
    if(e.target&&e.target.id==='snd')return;
    e.preventDefault();
    if(state==='play')turbo();else tapAdvance();
  }
});
document.addEventListener('contextmenu',e=>e.preventDefault());

const snd=document.getElementById('snd');
function applyMute(){
  document.getElementById('waves').style.display=muted?'none':'';
  document.getElementById('cross').style.display=muted?'':'none';
  snd.setAttribute('aria-pressed',muted?'true':'false');
  snd.setAttribute('aria-label',muted?'Posar el so':'Treure el so');
}
snd.addEventListener('pointerdown',e=>e.stopPropagation());
snd.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('fiore-mute',muted?'1':'0')}catch(e){}applyMute()});
applyMute();

/* ---------- mida i bucle ---------- */
const stage=document.getElementById('stage');
function fit(){
  const aw=stage.clientWidth-16,ah=stage.clientHeight-16;
  let s=Math.min(aw/W,ah/H);if(s>=2)s=Math.floor(s);s=Math.max(.5,s);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
}
window.addEventListener('resize',fit);fit();

startStage(0,false);state='title';st=0;
let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!document.hidden)update(dt);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
