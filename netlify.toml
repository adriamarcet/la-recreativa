# Web estàtica: no hi ha cap pas de build, Netlify publica la carpeta tal qual.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# /olla i /llapis com a enllaços curts per compartir
[[redirects]]
  from = "/olla"
  to = "/jocs/rei-de-lolla/"
  status = 301

[[redirects]]
  from = "/llapis"
  to = "/jocs/menjallapis/"
  status = 301

# l'adreça antiga del joc de Fiore
[[redirects]]
  from = "/jocs/fiore/*"
  to = "/jocs/turbocapitalisme/:splat"
  status = 301
